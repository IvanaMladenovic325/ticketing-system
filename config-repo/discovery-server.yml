server:
  port: 8761

eureka:
  client:
    # standalone server
    register-with-eureka: false
    fetch-registry: false
  server:
    # brže uklanjanje "mrtvih" instanci nego default (90s)
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
