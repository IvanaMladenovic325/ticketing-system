server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${EVENT_DB_HOST:localhost}:${EVENT_DB_PORT:5434}/event_db
    username: ${EVENT_DB_USERNAME}
    password: ${EVENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
