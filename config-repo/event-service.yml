server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${EVENT_DB_HOST:localhost}:${EVENT_DB_PORT:5434}/event_db
    username: ${EVENT_DB_USERNAME}
    password: ${EVENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
