server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5436}/payment_db
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    refresh:
      enable: false

payment:
  simulation:
    failure-rate: 0.0
    delay-ms: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, refresh
