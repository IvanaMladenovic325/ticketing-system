apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-alerts
    receivers:
      - uid: email-alerts
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: email-alerts
    group_by: ["grafana_folder", "alertname"]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
